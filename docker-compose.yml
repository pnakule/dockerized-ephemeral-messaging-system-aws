services:
  app:
    build: .
    container_name: flask-app
    restart: always

    expose:
      - "8000"

    env_file:
      - .env

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: Ephemeral@0.
      MYSQL_DATABASE: ephemeraldb

    ports:
      - "3306:3306"

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app



      
