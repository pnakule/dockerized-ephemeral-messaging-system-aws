services:
  app:
    build: .
    container_name: flask-app
    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: Ephemeral@0.
      MYSQL_DATABASE: ephemeraldb

    ports:
      - "3306:3306"
