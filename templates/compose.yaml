services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - mysql
    command: sh -c "sleep 60 && gunicorn --workers 2 --bind 0.0.0.0:8000 app:app"

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ephemeral
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
